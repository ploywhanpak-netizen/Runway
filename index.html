<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบขออนุมัติ - เลือกแผนก</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #f4f5f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
  }
  h1 {
    font-size: 28px;
    color: #1a1a1a;
    margin-bottom: 8px;
    text-align: center;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 40px;
    text-align: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }
  .dept-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-radius: 14px;
    padding: 32px 20px;
    text-decoration: none;
    color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid #eaeaea;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .dept-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.10);
  }
  .icon {
    font-size: 36px;
    margin-bottom: 12px;
  }
  .dept-name {
    font-size: 18px;
    font-weight: 600;
  }
  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border-radius: 14px;
    padding: 32px 20px;
    border: 2px dashed #ddd;
    color: #aaa;
    font-size: 15px;
  }
  footer {
    margin-top: 50px;
    color: #999;
    font-size: 13px;
  }
</style>
</head>
<body>

  <h1>ระบบขออนุมัติจากแผนกต่างๆ</h1>
  <p class="subtitle">เลือกแผนกที่ต้องการขออนุมัติ</p>

  <div class="grid">
    <a class="dept-card" href="https://ploywhanpak-netizen.github.io/WP/#billing" target="_blank" rel="noopener">
      <div class="icon">📣</div>
      <div class="dept-name">Marketing</div>
    </a>

    <div class="placeholder">
      แผนกถัดไป<br>(เร็วๆ นี้)
    </div>
    <div class="placeholder">
      แผนกถัดไป<br>(เร็วๆ นี้)
    </div>
  </div>

  <footer>อัปเดตล่าสุด: 31 กรกฎาคม 2569</footer>

</body>
</html>
