<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Runway — บัญชีครัวเรือน</title>
<style>
:root{
  --bg:#0E1116; --surface:#151A21; --raised:#1B212B; --line:#242B36; --line-2:#1D242E;
  --text:#E9EDF3; --dim:#8B96A6; --faint:#5B6472;
  --accent:#6E8BFF; --accent-2:#3C5BF5; --on-accent:#0A0F1C;
  --pos:#35C88F; --neg:#F0576E; --warn:#F2A93B;
  --c1:#6E8BFF; --c2:#35C88F; --c3:#F2A93B; --c4:#F0576E; --c5:#A78BFA; --c6:#4CC5D6;
  --shadow:0 18px 44px rgba(0,0,0,.5);
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#F5F6F8; --surface:#FFFFFF; --raised:#FFFFFF; --line:#E3E6EC; --line-2:#EDEFF3;
  --text:#0B1018; --dim:#5A6474; --faint:#8A94A4;
  --accent:#3C5BF5; --accent-2:#2E48D6; --on-accent:#FFFFFF;
  --pos:#0E8A5F; --neg:#D6304F; --warn:#B5730A;
  --c1:#3C5BF5; --c2:#0E8A5F; --c3:#B5730A; --c4:#D6304F; --c5:#7C4DEF; --c6:#0E8AA0;
  --shadow:0 16px 40px rgba(16,24,40,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.brand{padding:0 10px 20px;display:flex;flex-direction:column;gap:1px}
.brand b{font-size:16.5px;letter-spacing:-.02em;font-weight:600}
.brand span{font-size:11px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;background:none;color:var(--dim);cursor:pointer;width:100%;text-align:left;font-size:14px}
.nav:hover{background:var(--raised);color:var(--text)}
.nav[aria-current="page"]{background:var(--raised);color:var(--text);font-weight:550}
.nav[aria-current="page"] svg{color:var(--accent)}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .foot{margin-top:auto;display:flex;gap:6px;padding:0 4px}
main{padding:26px 30px 90px;max-width:1200px;width:100%}

/* ---------- header ---------- */
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:26px;font-weight:600;letter-spacing:-.03em}
.head .sub{color:var(--dim);font-size:13.5px;margin-top:3px}
.grow{flex:1 1 auto}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.ttl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ttl h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ttl .grow{flex:1}
h3.sub{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:22px 0 10px}

/* ---------- buttons ---------- */
.btn{background:var(--accent);color:var(--on-accent);border:1px solid transparent;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{background:var(--raised);filter:none}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--dim);display:inline-flex}
.btn.icon:hover{color:var(--text);background:var(--raised)}
.btn.icon svg{width:17px;height:17px}
.btn.warn{background:transparent;border-color:var(--line);color:var(--neg)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:29px;font-weight:300;letter-spacing:-.035em;margin:7px 0 3px;line-height:1.1}
.stat .n{font-size:12.5px;color:var(--dim)}

/* ---------- runway (signature) ---------- */
.runway{display:flex;gap:6px;align-items:flex-end;height:168px}
.rcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;cursor:default}
.rcol .amt{font-size:10.5px;color:var(--faint);text-align:center;letter-spacing:-.01em}
.rstack{display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;min-height:3px}
.rstack i{display:block;min-height:1px}
.rcol.now .amt{color:var(--accent);font-weight:600}
.raxis{display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line-2)}
.raxis div{flex:1;text-align:center;font-size:11px;color:var(--faint);min-width:0}
.raxis div.now{color:var(--text);font-weight:600}
.keys{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--dim)}
.keys span{display:flex;align-items:center;gap:6px}
.keys i{width:8px;height:8px;border-radius:2px;display:block}

/* ---------- two column ---------- */
.duo{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media(max-width:880px){.duo{grid-template-columns:1fr}}

/* ---------- monthly paper ---------- */
.paper{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.paperTop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
.paperSum{padding:14px 16px;border-right:1px solid var(--line)}
.paperSum:last-child{border-right:none}
.paperSum .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.paperSum .v{font-size:24px;font-weight:350;letter-spacing:-.03em;margin-top:4px}
.paperGrid{display:grid;grid-template-columns:1fr 1fr;min-height:520px}
.paperSide{padding:18px 18px 22px}
.paperSide:first-child{border-right:1px solid var(--line)}
.paperHead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.paperHead h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.paperHead .grow{flex:1}
.paperTable{width:100%;border-collapse:collapse;font-size:13.5px}
.paperTable th{background:color-mix(in srgb,var(--warn) 16%,transparent);padding:7px 8px;border:1px solid var(--line);color:var(--text);font-size:12px;letter-spacing:0;text-transform:none}
.paperTable td{padding:8px;border:1px solid var(--line);vertical-align:middle}
.paperTable tfoot td{font-weight:650;background:var(--raised)}
.paperTable .name{min-width:150px}
.paperTable .num{text-align:right;white-space:nowrap}
.paperNote{color:var(--faint);font-size:12.5px;margin-top:12px}
@media(max-width:880px){
  .paperTop{grid-template-columns:1fr 1fr}
  .paperGrid{grid-template-columns:1fr}
  .paperSide:first-child{border-right:none;border-bottom:1px solid var(--line)}
}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:13px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.row .when{width:64px;flex:0 0 auto;font-size:12.5px;color:var(--faint);font-family:var(--mono)}
.row .mid{flex:1;min-width:0}
.row .mid b{font-weight:550;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid small{color:var(--faint);font-size:12px}
.row .amt{font-size:14px;white-space:nowrap}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:550;padding:2.5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.neg{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 35%,transparent);background:color-mix(in srgb,var(--neg) 11%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 11%,transparent)}
.pill.pos{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 35%,transparent);background:color-mix(in srgb,var(--pos) 11%,transparent)}
.pill.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 11%,transparent)}

/* ---------- table ---------- */
.scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 12px 10px;white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
th:last-child,td:last-child{padding-right:0}
td{padding:12px;border-top:1px solid var(--line-2);vertical-align:top}
tbody tr:hover td{background:var(--raised)}
.r{text-align:right;white-space:nowrap}
.dim{color:var(--dim);font-size:12.5px;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
tfoot td{border-top:1px solid var(--line);font-weight:600;color:var(--text)}
tfoot tr:hover td{background:none}

/* ---------- meter ---------- */
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px;max-width:190px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barline{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.track{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-bottom:13px}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* ---------- donut ---------- */
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{flex:0 0 auto}
.donut .mid{position:relative}
.dlab{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.dlab .l{display:flex;align-items:center;gap:9px;font-size:13px}
.dlab .l i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.dlab .l span{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- forms ---------- */
label.f{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px;font-weight:600}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);background:var(--bg);border-radius:9px;font-family:inherit;font-size:14px;color:var(--text)}
[data-theme="light"] input,[data-theme="light"] select,[data-theme="light"] textarea{background:#FBFCFD}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:66px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.field.wide{grid-column:1/-1}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;background:rgba(6,9,14,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;overflow-y:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;box-shadow:var(--shadow);margin:auto}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 4px}
.sheet header b{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet .body{padding:16px 20px}
.sheet footer{display:flex;gap:9px;padding:14px 20px 18px;align-items:center}
.x{background:none;border:none;color:var(--faint);cursor:pointer;padding:4px;border-radius:8px;display:flex}
.x:hover{color:var(--text);background:var(--raised)}
.x svg{width:18px;height:18px}
@media(max-width:640px){
  .veil{padding:0;align-items:flex-end}
  .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:94vh;overflow-y:auto;margin:0}
}

/* ---------- misc ---------- */
.empty{text-align:center;padding:30px 16px;color:var(--dim)}
.empty p{font-size:13.5px;max-width:380px;margin:0 auto 16px}
.hint{font-size:12.5px;color:var(--faint);margin-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:550;z-index:80;box-shadow:var(--shadow)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:none;border:none;padding:6px 13px;font-size:13px;color:var(--dim);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text);font-weight:550}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;align-items:stretch;border-right:none;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:50;gap:0}
  .brand{display:none}
  .rail .foot{margin:0;padding:0;flex:0 0 auto;align-items:stretch}
  .rail .foot [data-theme-toggle]{display:none}
  .rail .foot .btn.icon{border:none;background:none;padding:6px 12px;align-items:center}
  .nav{flex:1 1 0;width:auto;min-width:0;flex-direction:column;gap:3px;padding:6px 2px;font-size:10px;justify-content:center;border-radius:10px}
  .nav span{max-width:100%;font-size:10px;letter-spacing:-.01em}
  .nav[aria-current="page"]{background:none;color:var(--accent)}
  main{padding:18px 16px 100px}
  .head h1{font-size:22px}
  .scroll{margin:0 -16px;padding:0 16px}
  .stat .v{font-size:25px}
}
@media(prefers-reduced-motion:no-preference){
  main>*{animation:rise .26s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>

<div class="app">
  <nav class="rail" id="rail"></nav>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
/* ═══════════ storage ═══════════ */
const KEY="samut-chiwit-v1";
const BLANK={tx:[],dues:[],debts:[],ins:[],cars:[],maint:[],props:[],bills:[],refi:[],docs:[],cfg:{theme:"dark"}};
const S={db:clone(BLANK),tab:"overview",month:ym(new Date()),ok:true};
function clone(o){return JSON.parse(JSON.stringify(o))}
const STORE={
  async get(){
    try{if(window.storage&&window.storage.get){const r=await window.storage.get(KEY);if(r&&r.value)return r.value}}catch(e){}
    try{return localStorage.getItem(KEY)}catch(e){return null}
  },
  async set(v){let ok=false;
    try{if(window.storage&&window.storage.set){await window.storage.set(KEY,v);ok=true}}catch(e){}
    try{localStorage.setItem(KEY,v);ok=true}catch(e){}
    return ok}
};
async function load(){
  try{const v=await STORE.get();if(v)S.db=Object.assign(clone(BLANK),JSON.parse(v))}catch(e){}
  if(!S.db.cfg)S.db.cfg={theme:"dark"};
  migrate();
  document.documentElement.dataset.theme=S.db.cfg.theme||"dark";
}
let timer=null;
function save(){clearTimeout(timer);timer=setTimeout(async()=>{
  S.ok=await STORE.set(JSON.stringify(S.db));
  if(!S.ok)toast("Can't save to this browser — export a backup file");
},140)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* translate any data saved by the earlier Thai build */
const MAP={
  "สินเชื่อบ้าน":"Mortgage","สินเชื่อรถ / เช่าซื้อ":"Auto loan / hire purchase","บัตรเครดิต":"Credit card",
  "สินเชื่อส่วนบุคคล":"Personal loan","บัตรกดเงินสด":"Cash card","หนี้นอกระบบ / ยืมบุคคล":"Private loan","อื่นๆ":"Other",
  "ลดต้นลดดอก":"Reducing balance","คงที่ (Flat rate)":"Flat rate",
  "รายรับ":"Income","รายจ่าย":"Expense",
  "รายเดือน":"Monthly","ราย 3 เดือน":"Quarterly","ราย 6 เดือน":"Semi-annual","รายปี":"Annual","จ่ายครั้งเดียว":"One-time",
  "จ่ายแล้ว":"Paid","ยังไม่จ่าย":"Unpaid",
  "ประกันรถ ชั้น 1":"Motor — class 1","ประกันรถ ชั้น 2+":"Motor — class 2+","ประกันรถ ชั้น 3+":"Motor — class 3+",
  "ประกันรถ ชั้น 3":"Motor — class 3","พ.ร.บ. รถยนต์":"Compulsory motor (Act)","ประกันชีวิต":"Life","ประกันสุขภาพ":"Health",
  "ประกันอุบัติเหตุ":"Personal accident","อัคคีภัยบ้าน/คอนโด":"Home & fire","ประกันสินเชื่อ (MRTA/MLTA)":"Mortgage life (MRTA/MLTA)","ประกันเดินทาง":"Travel",
  "คอนโด":"Condo","บ้านเดี่ยว":"Detached house","ทาวน์เฮาส์":"Townhouse","ที่ดิน":"Land",
  "สัญญาเช่าซื้อ":"Hire purchase","สัญญากู้เงิน":"Loan agreement","สัญญาซื้อขาย":"Sale & purchase","สัญญาเช่า":"Lease","สัญญาจำนอง":"Mortgage deed","ใบรับประกัน":"Warranty"
};
function migrate(){
  const swap=(o,k)=>{if(o&&MAP[o[k]])o[k]=MAP[o[k]]};
  S.db.debts.forEach(d=>{swap(d,"type");swap(d,"method")});
  const catTH={"Salary":"เงินเดือน","Bonus":"โบนัส","Freelance":"งานเสริม","Rent received":"ค่าเช่าได้รับ","Interest & dividends":"ดอกเบี้ย/เงินปันผล","Other":"อื่นๆ","Food & drink":"อาหาร/เครื่องดื่ม","Groceries":"ของใช้/ซูเปอร์มาร์เก็ต","Fuel & transport":"เดินทาง/น้ำมัน","Tolls & parking":"ทางด่วน/ที่จอดรถ","Loan payments":"จ่ายหนี้","Home & utilities":"บ้าน/ค่าสาธารณูปโภค","Insurance":"ประกัน","Car maintenance":"ซ่อมบำรุงรถ","Health":"สุขภาพ","Education":"การศึกษา","Entertainment":"บันเทิง"};
  S.db.tx.forEach(t=>{swap(t,"kind");if(t.kind==="Income")t.kind="รายรับ";if(t.kind==="Expense")t.kind="รายจ่าย";if(catTH[t.cat])t.cat=catTH[t.cat]});
  S.db.ins.forEach(i=>{swap(i,"type");swap(i,"cycle")});
  S.db.bills.forEach(b=>swap(b,"paid"));
  S.db.props.forEach(p=>swap(p,"type"));
  S.db.docs.forEach(d=>swap(d,"kind"));
}

/* ═══════════ helpers ═══════════ */
const N=v=>{const n=parseFloat(String(v??"").replace(/,/g,""));return isFinite(n)?n:0};
function fmt(n,d){n=N(n);return n.toLocaleString("en-US",{minimumFractionDigits:d??0,maximumFractionDigits:d??(Number.isInteger(n)?0:2)})}
function money(n){return "฿"+fmt(Math.round(N(n)))}
function compact(n){n=Math.round(N(n));if(!n)return"";if(Math.abs(n)>=1e6)return (n/1e6).toFixed(n%1e6?1:0)+"M";if(Math.abs(n)>=1000)return Math.round(n/1000)+"k";return String(n)}
function ym(d){return d.toISOString().slice(0,7)}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function iso(d){return d.toISOString().slice(0,10)}
function pd(s){if(!s)return null;const d=new Date(s+(String(s).length===7?"-01":""));return isNaN(d)?null:d}
function dshort(s){const d=pd(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"}):"—"}
function dfull(s){const d=pd(s);return d?d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}):"—"}

/* ═══════════ loan maths ═══════════ */
function pmtReducing(P,r,n){const i=r/100/12;if(!n)return 0;if(i<=0)return P/n;return P*i/(1-Math.pow(1+i,-n))}
function scheduleOf(d){
  const rows=[],flat=isFlat(d.method),P=N(d.principal)||N(d.balance),n=Math.round(N(d.term)),r=N(d.rate);
  if(!P||!n)return rows;
  let pay=N(d.payment)||(flat?(P+P*r/100*(n/12))/n:pmtReducing(P,r,n));
  const start=pd(d.start)||today(),flatInt=P*r/100/12;
  let bal=P;
  for(let k=1;k<=n&&bal>.5;k++){
    const dt=new Date(start.getFullYear(),start.getMonth()+k,start.getDate());
    const int=flat?flatInt:bal*r/100/12;
    let prin=pay-int;if(prin<=0)break;if(prin>bal)prin=bal;
    bal=Math.max(0,bal-prin);
    rows.push({k,date:dt,pay:prin+int,int,prin,bal});
  }
  return rows;
}
function remainMonths(d){
  const bal=N(d.balance),pay=N(d.payment),r=N(d.rate);
  if(bal<=0)return 0;if(pay<=0)return 999;
  if(isCard(d.type)||!isFlat(d.method)){let b=bal,m=0;while(b>.5&&m<600){const i=b*r/100/12;if(pay<=i+.01)return 999;b-=pay-i;m++}return m}
  return Math.ceil(bal/pay);
}
function paidStats(d){
  const rows=scheduleOf(d);if(!rows.length)return null;
  const now=today();let pi=0,pp=0,c=0;
  rows.forEach(r=>{if(r.date<=now){pi+=r.int;pp+=r.prin;c++}});
  return {rows,paidInt:pi,paidPrin:pp,count:c,total:rows.reduce((s,r)=>s+r.pay,0),totalInt:rows.reduce((s,r)=>s+r.int,0)};
}
function cardMin(d){return Math.max(N(d.payment),N(d.balance)*N(d.minPct)/100)}
function duePayment(d){return isCard(d.type)?cardMin(d):N(d.payment)}
function billTotal(b){return N(b.common)+N(b.water)+N(b.elec)+N(b.parking)+N(b.other)}

function nextByDay(day){const t=today(),d=Math.min(Math.max(Math.round(N(day))||1,1),28);
  let x=new Date(t.getFullYear(),t.getMonth(),d);if(x<t)x=new Date(t.getFullYear(),t.getMonth()+1,d);return x}
function dateInMonth(mk,day){const [y,m]=String(mk).split("-").map(Number),last=new Date(y,m,0).getDate(),d=Math.min(Math.max(Math.round(N(day))||1,1),last);return mk+"-"+String(d).padStart(2,"0")}
function dueStatus(date,paid){
  if(paid)return '<span class="pill pos">จ่ายแล้ว</span>';
  const d=daysTo(date,today());
  if(d<0)return '<span class="pill neg">เกินกำหนด</span>';
  if(d<=7)return '<span class="pill warn">ใกล้ถึง</span>';
  return '<span class="pill">ต้องจ่าย</span>';
}
function monthDueItems(mk){
  const out=[];
  (S.db.dues||[]).forEach(x=>{
    if(x.month===mk)out.push({date:dateInMonth(mk,1),item:x.name||"รายการจ่าย",cat:x.cat||"อื่นๆ",amount:N(x.amount),paidAmount:N(x.paid),manual:true,edit:"dues",id:x.id,note:x.note});
  });
  S.db.debts.forEach(d=>{
    const amount=duePayment(d);
    if(N(d.balance)>0&&amount>0)out.push({date:dateInMonth(mk,d.dueDay||1),item:(d.name||"หนี้")+" ค่างวด",cat:"หนี้",amount,paidAmount:0,edit:"debts",id:d.id});
  });
  S.db.ins.forEach(p=>{
    if((p.nextPay||"").slice(0,7)===mk&&N(p.premium)>0)out.push({date:p.nextPay,item:(p.name||"ประกัน")+" ค่าเบี้ยประกัน",cat:"ประกัน",amount:N(p.premium),paidAmount:0,edit:"ins",id:p.id});
  });
  S.db.bills.forEach(b=>{
    if(b.month===mk)out.push({date:dateInMonth(mk,5),item:refLabel("props",b.propId)+" บิลบ้าน/คอนโด",cat:"บ้าน/คอนโด",amount:billTotal(b),paidAmount:b.paid==="Paid"?billTotal(b):0,edit:"bills",id:b.id});
  });
  S.db.props.forEach(p=>{
    if(S.db.bills.some(b=>b.propId===p.id&&b.month===mk))return;
    const bs=S.db.bills.filter(b=>b.propId===p.id).sort((a,b)=>(b.month||"").localeCompare(a.month||"")).slice(0,3);
    const avgUtil=bs.length?bs.reduce((s,b)=>s+N(b.water)+N(b.elec)+N(b.other),0)/bs.length:0;
    const amount=N(p.common)+N(p.parking)+avgUtil;
    if(amount>0)out.push({date:dateInMonth(mk,5),item:(p.name||"บ้าน/คอนโด")+" ประมาณการค่าใช้จ่าย",cat:"บ้าน/คอนโด",amount,paidAmount:0,estimate:true,edit:"props",id:p.id});
  });
  return out.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}

function upcoming(){
  const out=[],t=today();
  S.db.debts.forEach(d=>{if(N(d.balance)>0&&N(d.dueDay))out.push({date:iso(nextByDay(d.dueDay)),label:(d.name||"Debt")+" payment",tag:d.type,amount:duePayment(d)})});
  S.db.ins.forEach(p=>{
    if(p.nextPay)out.push({date:p.nextPay,label:(p.name||"Policy")+" premium",tag:p.type,amount:N(p.premium)});
    if(p.expire)out.push({date:p.expire,label:(p.name||"Policy")+" expires",tag:"Renewal",amount:0})});
  S.db.cars.forEach(c=>{if(c.taxExpire)out.push({date:c.taxExpire,label:"Road tax — "+(c.name||c.plate),tag:"Vehicle",amount:0})});
  S.db.maint.forEach(m=>{if(m.nextDate)out.push({date:m.nextDate,label:"Service — "+refLabel("cars",m.carId),tag:m.item||"Maintenance",amount:0})});
  S.db.docs.forEach(x=>{if(x.end)out.push({date:x.end,label:(x.name||"Contract")+" ends",tag:x.kind||"Document",amount:0})});
  S.db.bills.forEach(b=>{if(b.paid!=="Paid"&&b.month)out.push({date:b.month+"-05",label:refLabel("props",b.propId)+" bill — "+mlabel(b.month),tag:"Utilities",amount:billTotal(b)})});
  return out.filter(x=>pd(x.date)).map(x=>Object.assign(x,{dd:daysTo(x.date,t)}))
    .filter(x=>x.dd>=-60&&x.dd<=90).sort((a,b)=>a.dd-b.dd);
}
const RKEYS=[["loans","ค่างวดหนี้","var(--c1)"],["ins","ประกัน","var(--c5)"],["home","บ้าน/คอนโด","var(--c6)"]];
function runway(){
  const t=today(),M=[];
  for(let i=0;i<12;i++){const d=new Date(t.getFullYear(),t.getMonth()+i,1);M.push({key:ym(d),loans:0,ins:0,home:0,sum:0})}
  const add=(i,k,v)=>{if(i<0||i>11||!v)return;M[i][k]+=v;M[i].sum+=v};
  S.db.debts.forEach(d=>{const p=duePayment(d);if(p<=0||N(d.balance)<=0)return;
    const left=Math.min(remainMonths(d),12);for(let i=0;i<left;i++)add(i,"loans",p)});
  S.db.ins.forEach(p=>{const step=CYCLE[p.cycle]??0,prem=N(p.premium);if(!prem)return;
    const first=pd(p.nextPay)||pd(p.expire);if(!first)return;
    let i=(first.getFullYear()-t.getFullYear())*12+(first.getMonth()-t.getMonth());
    if(step===0){add(i,"ins",prem);return}
    while(i<0)i+=step;
    for(;i<12;i+=step)add(i,"ins",prem)});
  S.db.props.forEach(p=>{const fixed=N(p.common)+N(p.parking);
    const bs=S.db.bills.filter(b=>b.propId===p.id).sort((a,b)=>(b.month||"").localeCompare(a.month||"")).slice(0,3);
    const util=bs.length?bs.reduce((s,b)=>s+N(b.water)+N(b.elec),0)/bs.length:0;
    for(let i=0;i<12;i++)add(i,"home",fixed+util)});
  return M;
}

  function fieldHTML(f){

    if(f.t==="select"){
      const o=typeof f.o==="function"?f.o(draft):f.o;
      inner='<select data-k="'+f.k+'"'+(f.drives?' data-drives="1"':"")+'>'+(f.req?"":'<option value=""></option>')+
        o.map(x=>'<option'+(String(v)===x?" selected":"")+">"+esc(x)+"</option>").join("")+"</select>";
    }else if(f.t==="ref"){
      inner='<select data-k="'+f.k+'"><option value="">— none —</option>'+
        (S.db[f.ref]||[]).map(r=>'<option value="'+r.id+'"'+(v===r.id?" selected":"")+">"+esc(refLabel(f.ref,r.id))+"</option>").join("")+"</select>";
    }else if(f.t==="scope"){
      inner='<select data-k="'+f.k+'">'+scopeOpts().map(o=>'<option value="'+esc(o.v)+'"'+(v===o.v?" selected":"")+">"+esc(o.l)+"</option>").join("")+"</select>";
    }else if(f.t==="list"){
      const o=(typeof f.o==="function"?f.o(draft):f.o)||[];
      inner='<input data-k="'+f.k+'" list="dl-'+f.k+'" value="'+esc(v)+'"'+ph+'><datalist id="dl-'+f.k+'">'+o.map(x=>"<option>"+esc(x)+"</option>").join("")+"</datalist>";
    }else if(f.t==="area"){
      inner='<textarea data-k="'+f.k+'"'+ph+">"+esc(v)+"</textarea>";
    }else{
      const ty=f.t==="number"?"number":f.t==="date"?"date":f.t==="month"?"month":"text";
      inner='<input type="'+ty+'" data-k="'+f.k+'" value="'+esc(v)+'"'+ph+(f.t==="number"?' step="any" inputmode="decimal"':"")+">";
    }
    return '<div class="field'+(f.wide?" wide":"")+'"><label class="f">'+esc(f.l)+"</label>"+inner+"</div>";
  }
  function paint(){
    body.innerHTML=sc.fields.filter(f=>!f.when||f.when(draft)).map(fieldHTML).join("");
    body.querySelectorAll("[data-k]").forEach(i=>{
      i.addEventListener("input",e=>draft[e.target.dataset.k]=e.target.value);
      i.addEventListener("change",e=>{draft[e.target.dataset.k]=e.target.value;
        if(e.target.dataset.drives){if(sc.fields.some(f=>f.k==="cat"))draft.cat="";paint()}});
    });
  }
  paint();
  foot.innerHTML=(rec?'<button class="btn warn" id="del">ลบ</button>':"")+'<div class="grow"></div><button class="btn ghost" id="cancel">ยกเลิก</button><button class="btn" id="ok">'+(rec?"บันทึกการแก้ไข":"เพิ่ม")+"</button>";
  const close=()=>veil.remove();
  veil.querySelector(".x").onclick=close;foot.querySelector("#cancel").onclick=close;
  veil.addEventListener("mousedown",e=>{if(e.target===veil)close()});
  if(rec)foot.querySelector("#del").onclick=()=>{if(confirm("ลบ"+sc.one+"นี้? เมื่อลบแล้วกู้คืนไม่ได้"))
    {S.db[ent]=S.db[ent].filter(r=>r.id!==id);save();close();render();toast("ลบแล้ว")}};
  foot.querySelector("#ok").onclick=()=>{
    const miss=sc.fields.filter(f=>f.req&&(!f.when||f.when(draft))&&!String(draft[f.k]??"").trim());
    if(miss.length){toast("กรุณากรอก "+miss[0].l);return}
    if(rec)Object.assign(rec,draft);else{draft.id=uid();S.db[ent].push(draft)}
    save();close();render();toast(rec?"บันทึกแล้ว":"เพิ่มแล้ว");
  };
  document.getElementById("layer").appendChild(veil);
  const first=body.querySelector("input,select,textarea");if(first)first.focus();
}

function head(title,sub,actions){
  return '<div class="head"><div><h1>'+esc(title)+'</h1><div class="sub">'+sub+'</div></div><div class="grow"></div>'+(actions||"")+"</div>";
}
function stat(k,v,n,cls){return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v'+(cls?" "+cls:"")+'">'+v+'</div><div class="n">'+(n||"")+"</div></div>"}
function tbl(h,rows,foot){return '<div class="scroll"><table><thead><tr>'+h+"</tr></thead><tbody>"+rows+"</tbody>"+(foot?"<tfoot><tr>"+foot+"</tr></tfoot>":"")+"</table></div>"}
function editBtn(e,id){return '<button class="btn ghost sm" data-edit="'+e+'" data-id="'+id+'">แก้ไข</button>'}
function addBtn(e,label,preset){return '<button class="btn" data-add="'+e+'"'+(preset?" data-preset='"+esc(JSON.stringify(preset))+"'":"")+">"+esc(label)+"</button>"}
function blank(title,body,ent,label){
  return '<div class="empty"><h3 style="font-size:15px;font-weight:600;margin-bottom:6px">'+esc(title)+"</h3><p>"+esc(body)+"</p>"+addBtn(ent,label)+"</div>";
}
function groupTint(cat){
  cat=String(cat||"");
  if(/Purpose|จุดบันทึก/.test(cat))return "background:color-mix(in srgb,var(--warn) 18%,transparent)";
  if(/Home|Property|Utilities|บ้าน|คอนโด|ค่าน้ำ|ค่าไฟ/.test(cat))return "background:color-mix(in srgb,var(--c5) 18%,transparent)";
  if(/Vehicle|รถ/.test(cat))return "background:color-mix(in srgb,var(--pos) 18%,transparent)";
  if(/Cash|Card|Debt|เงินกู้|บัตร|หนี้/.test(cat))return "background:color-mix(in srgb,var(--c1) 18%,transparent)";
  if(/Pay later|ผ่อน/.test(cat))return "background:color-mix(in srgb,var(--c3) 18%,transparent)";
  if(/Insurance|ประกัน/.test(cat))return "background:color-mix(in srgb,var(--c6) 18%,transparent)";
  return "background:color-mix(in srgb,var(--line) 45%,transparent)";
}
function recentMonths(n){
  const t=today(),out=[];
  for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);out.push(ym(d))}
  return out;
}
function paidForMonth(mk){
  const txPaid=S.db.tx.filter(x=>(x.date||"").slice(0,7)===mk&&!isIncome(x)).reduce((s,x)=>s+N(x.amount),0);
  const duesPaid=monthDueItems(mk).reduce((s,x)=>s+Math.min(N(x.amount),N(x.paidAmount)),0);
  return Math.max(txPaid,duesPaid);
}
function reductionAdvice(mk){
  const exp=S.db.tx.filter(x=>(x.date||"").slice(0,7)===mk&&!isIncome(x));
  const cats={};
  exp.forEach(x=>{cats[x.cat||"Other"]=(cats[x.cat||"Other"]||0)+N(x.amount)});
  const top=Object.entries(cats).filter(([k])=>!/loan|debt|insurance/i.test(k)).sort((a,b)=>b[1]-a[1])[0];
  const inc=S.db.tx.filter(x=>(x.date||"").slice(0,7)===mk&&isIncome(x)).reduce((s,x)=>s+N(x.amount),0);
  const debtPay=S.db.debts.reduce((s,d)=>s+(N(d.balance)>0?duePayment(d):0),0);
  if(inc&&debtPay/inc>.45)return {tone:"neg",title:"ภาระหนี้สูง",body:"ค่างวดหนี้คิดเป็น "+Math.round(debtPay/inc*100)+"% ของรายรับ ควรลดรายจ่ายยืดหยุ่นก่อน และงดเพิ่มรายการผ่อนใหม่จนกว่าสัดส่วนนี้จะต่ำกว่า 35%"};
  if(top&&top[1]>0)return {tone:"warn",title:"ระวังหมวด "+top[0],body:"หมวดนี้เป็นรายจ่ายยืดหยุ่นที่สูงสุด อยู่ที่ "+money(top[1])+" ถ้าลดได้ 10-15% จะเอาเงินส่วนนั้นไปโปะหนี้เพิ่มได้"};
  return {tone:"pos",title:"ยังไม่มีจุดเสี่ยงชัด",body:"เพิ่มรายจ่ายจริงและรายรับของเดือนนี้ก่อน แล้วระบบจะช่วยชี้หมวดที่ควรลดเป็นอันดับแรก"};
}
function pillFor(dd){
  if(dd<0)return '<span class="pill neg">เกิน '+Math.abs(dd)+" วัน</span>";
  if(dd===0)return '<span class="pill warn">ครบกำหนดวันนี้</span>';
  if(dd<=14)return '<span class="pill warn">อีก '+dd+" วัน</span>";
  return '<span class="pill">อีก '+dd+" วัน</span>";
}

function vPaperMonth(){
  const income=S.db.tx.filter(x=>(x.date||"").slice(0,7)===S.month&&isIncome(x)).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const actualExpense=S.db.tx.filter(x=>(x.date||"").slice(0,7)===S.month&&!isIncome(x));
  const dues=monthDueItems(S.month);
  const incTotal=income.reduce((s,x)=>s+N(x.amount),0);
  const dueTotal=dues.reduce((s,x)=>s+N(x.amount),0);
  const paidTotal=dues.reduce((s,x)=>s+Math.min(N(x.amount),N(x.paidAmount)),0);
  const actualTotal=actualExpense.reduce((s,x)=>s+N(x.amount),0);
  const expenseTotal=Math.max(dueTotal,actualTotal);
  const paidDisplay=dues.length?paidTotal:actualTotal;
  const remaining=Math.max(0,expenseTotal-paidDisplay);
  const balance=incTotal-expenseTotal;
  const incomeRows=income.map(x=>
    "<tr><td class='name'><b>"+esc(x.cat||"รายรับ")+"</b>"+(x.note?"<div class='dim'>"+esc(x.note)+"</div>":"")+"</td>"+
    "<td class='num pos'>"+fmt(x.amount,2)+"</td><td class='r'>"+editBtn("tx",x.id)+"</td></tr>").join("");
  const dueRows=dues.map(x=>{const amount=N(x.amount),paid=Math.min(amount,N(x.paidAmount)),left=Math.max(0,amount-paid);
    return "<tr><td class='name' style='"+groupTint(x.cat)+"'><b>"+esc(x.item)+"</b><div class='dim'>"+esc(x.cat||"")+(x.estimate?" · ประมาณการ":"")+"</div></td>"+
    "<td class='num'>"+fmt(amount,2)+"</td><td class='num pos'>"+fmt(paid,2)+"</td><td class='num "+(left?"neg":"pos")+"'>"+fmt(left,2)+"</td><td class='r'>"+(x.edit?editBtn(x.edit,x.id):"")+"</td></tr>";
  }).join("");
  const actualRows=!dues.length&&actualExpense.length?actualExpense.sort((a,b)=>(a.date||"").localeCompare(b.date||"")).map(x=>
    "<tr><td class='name'><b>"+esc(x.cat||"รายจ่าย")+"</b>"+(x.note?"<div class='dim'>"+esc(x.note)+"</div>":"")+"</td><td class='num'>"+fmt(x.amount,2)+"</td><td class='num pos'>"+fmt(x.amount,2)+"</td><td class='num pos'>0.00</td><td class='r'>"+editBtn("tx",x.id)+"</td></tr>").join(""):"";
  const advice=reductionAdvice(S.month);
  let h=head("รายรับ / รายจ่าย",'<input type="month" data-month value="'+S.month+'" style="width:auto;padding:4px 8px;font-size:13px;margin-top:4px">',addBtn("tx","เพิ่มรายรับ",{kind:"รายรับ",date:iso(new Date())})+' <button class="btn ghost" data-add="dues" data-preset="'+esc(JSON.stringify({month:S.month}))+'">เพิ่มรายจ่าย</button>');
  h+='<div class="paper">'+
    '<div class="paperTop">'+
      '<div class="paperSum"><div class="k">รายรับรวม</div><div class="v pos">'+money(incTotal)+'</div></div>'+
      '<div class="paperSum"><div class="k">รายจ่ายรวม</div><div class="v neg">'+money(expenseTotal)+'</div></div>'+
      '<div class="paperSum"><div class="k">ค้างจ่าย</div><div class="v '+(remaining?"neg":"pos")+'">'+money(remaining)+'</div></div>'+
      '<div class="paperSum"><div class="k">คงเหลือ</div><div class="v '+(balance<0?"neg":"pos")+'">'+(balance<0?"−":"")+money(Math.abs(balance))+'</div></div>'+
    '</div>'+
    '<div class="paperGrid">'+
      '<section class="paperSide"><div class="paperHead"><h2>รายรับ</h2><div class="grow"></div><span class="pill pos">'+money(incTotal)+'</span></div>'+
      '<table class="paperTable"><thead><tr><th>รายการ</th><th class="num">ยอด</th><th></th></tr></thead><tbody>'+
      (incomeRows||'<tr><td colspan="3" class="empty">ยังไม่มีรายรับเดือนนี้</td></tr>')+
      '</tbody><tfoot><tr><td>รวมรายรับ</td><td class="num pos">'+fmt(incTotal,2)+'</td><td></td></tr></tfoot></table>'+
      '<p class="paperNote">ใส่เงินเดือน โบนัส งานเสริม หรือรายรับอื่นทั้งหมดไว้ฝั่งนี้</p></section>'+
      '<section class="paperSide"><div class="paperHead"><h2>รายจ่าย</h2><div class="grow"></div><span class="pill neg">'+money(expenseTotal)+'</span></div>'+
      '<table class="paperTable"><thead><tr><th>รายการ</th><th class="num">ยอด</th><th class="num">จ่ายแล้ว</th><th class="num">ค้างจ่าย</th><th></th></tr></thead><tbody>'+
      (dueRows||actualRows||'<tr><td colspan="5" class="empty">ยังไม่มีรายจ่ายเดือนนี้</td></tr>')+
      '</tbody><tfoot><tr><td>รวมรายจ่าย</td><td class="num">'+fmt(expenseTotal,2)+'</td><td class="num pos">'+fmt(paidDisplay,2)+'</td><td class="num '+(remaining?"neg":"pos")+'">'+fmt(remaining,2)+'</td><td></td></tr></tfoot></table>'+
      '<p class="paperNote">'+esc(advice.title)+" · "+esc(advice.body)+'</p></section>'+
    '</div></div>';
  return h;

/* ---- overview ---- */
function vOverview(){
  const t=today(),mk=ym(t);
  const debt=S.db.debts.reduce((s,d)=>s+N(d.balance),0);
  const per=S.db.debts.reduce((s,d)=>s+(N(d.balance)>0?duePayment(d):0),0);
  const m=S.db.tx.filter(x=>(x.date||"").slice(0,7)===mk);
  const inc=m.filter(isIncome).reduce((s,x)=>s+N(x.amount),0);
  const exp=m.filter(x=>!isIncome(x)).reduce((s,x)=>s+N(x.amount),0);
  const net=inc-exp;

  let h=head("ภาพรวม",dfull(iso(t)),addBtn("tx","เพิ่มรายการเงิน"));
  h+='<div class="stats">'+
    stat("หนี้รวม",money(debt),S.db.debts.length+" บัญชี")+

        stat("Servicing to date",money(spend),ms.length+" visit"+(ms.length===1?"":"s"))+"</div>";

    if(ins.length)h+='<h3 class="sub">Insurance</h3>'+tbl("<th>Policy</th><th class='r'>Sum insured</th><th class='r'>Premium</th><th class='r'>Expires</th><th></th>",
      ins.map(p=>"<tr><td>"+esc(p.name)+"<div class='dim'>"+esc(p.type)+(p.company?" · "+esc(p.company):"")+"</div></td><td class='r'>"+money(p.sum)+"</td><td class='r'>"+money(p.premium)+"</td><td class='r'>"+dshort(p.expire)+"</td><td class='r'>"+editBtn("ins",p.id)+"</td></tr>").join(""));

    if(loans.length)h+='<h3 class="sub">Finance</h3>'+tbl("<th>Account</th><th class='r'>Balance</th><th class='r'>Monthly</th><th></th>",
      loans.map(d=>"<tr><td>"+esc(d.name)+"<div class='dim'>"+esc(d.lender||"")+"</div></td><td class='r'>"+money(d.balance)+"</td><td class='r'>"+money(d.payment)+"</td><td class='r'>"+(N(d.term)?'<button class="btn ghost sm" data-sched="'+d.id+'">Schedule</button>':"")+"</td></tr>").join(""));

    h+='<h3 class="sub">Service history</h3>';
    h+=ms.length?tbl("<th>Date</th><th class='r'>Odometer</th><th>Work done</th><th class='r'>Cost</th><th class='r'>Next due</th><th></th>",
      ms.map(m=>"<tr><td>"+dshort(m.date)+"</td><td class='r'>"+(N(m.mileage)?fmt(m.mileage):"—")+"</td><td>"+esc(m.item)+(m.place?"<div class='dim'>"+esc(m.place)+"</div>":"")+"</td><td class='r'>"+money(m.cost)+"</td><td class='r'>"+(m.nextDate?dshort(m.nextDate):"—")+(N(m.nextMileage)?"<div class='dim'>or "+fmt(m.nextMileage)+" km</div>":"")+"</td><td class='r'>"+editBtn("maint",m.id)+"</td></tr>").join(""))
      :'<div class="empty"><p>No service logged yet.</p><button class="btn ghost" data-add="maint">Log a service</button></div>';
    h+=docsCard("Documents",docs,"cars:"+c.id,true)+"</div>";
  });
  return h;
}

/* ---- property ---- */
function vProps(){
  const ps=S.db.props;
  let h=head("บ้าน/คอนโด",ps.length?"บิล สินเชื่อ และเอกสารแยกตามทรัพย์สิน":"บิล สินเชื่อ รีไฟแนนซ์ และสัญญา",
    addBtn("props","เพิ่มบ้าน/คอนโด")+' <button class="btn ghost" data-add="bills">เพิ่มบิล</button>');
  if(!ps.length)return h+'<div class="card">'+blank("ยังไม่มีบ้าน/คอนโด","เพิ่มคอนโดหรือบ้านเพื่อดูค่าส่วนกลาง ค่าน้ำ ค่าไฟ ที่จอดรถ และสินเชื่อในหน้าเดียว","props","เพิ่มรายการแรก")+"</div>";

  ps.forEach(p=>{
    const bills=S.db.bills.filter(b=>b.propId===p.id).sort((a,b)=>(b.month||"").localeCompare(a.month||""));
    const ins=S.db.ins.filter(x=>x.linkProp===p.id),loans=S.db.debts.filter(d=>d.type===MORTGAGE);
    const refis=S.db.refi.filter(r=>r.propId===p.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const docs=S.db.docs.filter(x=>x.scope==="props:"+p.id);
    const avgSet=bills.slice(0,6),avg=avgSet.length?avgSet.reduce((s,b)=>s+billTotal(b),0)/avgSet.length:0;
    const unpaid=bills.filter(b=>b.paid!=="Paid").reduce((s,b)=>s+billTotal(b),0);
    const lp=loans.reduce((s,d)=>s+N(d.payment),0),lb=loans.reduce((s,d)=>s+N(d.balance),0);
    const fixed=N(p.common)+N(p.parking);

    h+='<div class="card"><div class="ttl"><h2>'+esc(p.name)+'</h2><div class="grow"></div>'+editBtn("props",p.id)+"</div>"+
      '<div class="dim" style="margin:-8px 0 14px">'+esc([p.type,p.room&&("Unit "+p.room),N(p.area)&&(fmt(p.area)+" sqm")].filter(Boolean).join(" · "))+
      (N(p.rate)?" · common fee "+fmt(p.rate,2)+"/sqm":"")+"</div>"+
      '<div class="stats">'+
        stat("Running cost / month",money(fixed+Math.max(0,avg-fixed)),"fees, parking and average utilities")+
        stat("Mortgage balance",money(lb),lp?money(lp)+" per month":"no mortgage linked")+
        stat("Unpaid bills",money(unpaid),unpaid?"settle before the late fee":"all settled")+"</div>";

    if(loans.length){
      h+='<h3 class="sub">Mortgage</h3>';
      loans.forEach(d=>{const st=paidStats(d);
        h+=tbl("<th>Account</th><th class='r'>Balance</th><th class='r'>Rate</th><th class='r'>Monthly</th><th class='r'>Interest paid</th><th></th>",
          "<tr><td><b style='font-weight:550'>"+esc(d.name)+"</b><div class='dim'>"+esc(d.lender||"")+" · "+esc(d.method||"")+(N(d.term)?" · "+d.term+" instalments":"")+"</div></td>"+
          "<td class='r'>"+money(d.balance)+"</td><td class='r'>"+fmt(d.rate,2)+"%</td><td class='r'>"+money(d.payment)+"</td>"+
          "<td class='r'>"+(st?money(st.paidInt)+"<div class='dim'>"+money(st.paidPrin)+" off principal</div>":"—")+"</td>"+
          "<td class='r'>"+(N(d.term)?'<button class="btn ghost sm" data-sched="'+d.id+'">Schedule</button> ':"")+editBtn("debts",d.id)+"</td></tr>");
      });
    }

    h+='<h3 class="sub">Bills</h3>';
    h+=bills.length?tbl("<th>Month</th><th class='r'>Common</th><th class='r'>Water</th><th class='r'>Electricity</th><th class='r'>Parking</th><th class='r'>Other</th><th class='r'>Total</th><th class='r'>Status</th><th></th>",
      bills.map(b=>"<tr><td>"+mlabel(b.month)+"</td><td class='r'>"+fmt(b.common)+"</td><td class='r'>"+fmt(b.water)+"</td><td class='r'>"+fmt(b.elec)+"</td><td class='r'>"+fmt(b.parking)+"</td><td class='r'>"+fmt(b.other)+"</td><td class='r'><b>"+money(billTotal(b))+"</b></td><td class='r'>"+(b.paid==="Paid"?'<span class="pill pos">paid</span>':'<span class="pill warn">unpaid</span>')+"</td><td class='r'>"+editBtn("bills",b.id)+"</td></tr>").join(""),
      "<td>Average of last "+avgSet.length+"</td><td colspan='5'></td><td class='r'>"+money(avg)+"</td><td colspan='2'></td>")
      :'<div class="empty"><p>No bills logged. A year of entries shows exactly how much the hot season costs you.</p><button class="btn ghost" data-add="bills">Add a bill</button></div>';

    if(ins.length)h+='<h3 class="sub">Insurance</h3>'+tbl("<th>Policy</th><th class='r'>Sum insured</th><th class='r'>Premium</th><th class='r'>Expires</th><th></th>",
      ins.map(x=>"<tr><td>"+esc(x.name)+"<div class='dim'>"+esc(x.type)+"</div></td><td class='r'>"+money(x.sum)+"</td><td class='r'>"+money(x.premium)+"</td><td class='r'>"+dshort(x.expire)+"</td><td class='r'>"+editBtn("ins",x.id)+"</td></tr>").join(""));

    h+='<h3 class="sub">Refinancing</h3>';
    h+=refis.length?tbl("<th>Date</th><th>Lender</th><th class='r'>Amount</th><th class='r'>Rate</th><th class='r'>New payment</th><th class='r'>Fees</th><th class='r'>Next window</th><th></th>",
      refis.map(r=>"<tr><td>"+dshort(r.date)+"</td><td>"+esc(r.bank)+(r.note?"<div class='dim'>"+esc(r.note)+"</div>":"")+"</td><td class='r'>"+money(r.amount)+"</td><td class='r'>"+(N(r.oldRate)?fmt(r.oldRate,2)+"% → ":"")+fmt(r.newRate,2)+"%</td><td class='r'>"+money(r.newPayment)+"</td><td class='r'>"+money(r.fees)+"</td><td class='r'>"+dshort(r.nextChance)+"</td><td class='r'>"+editBtn("refi",r.id)+"</td></tr>").join(""))
      :'<div class="empty"><p>No refinancing recorded. Most Thai mortgages open a window after three years — log the date and it lands in Coming up.</p><button class="btn ghost" data-add="refi">Record a refinance</button></div>';

    h+=docsCard("Documents",docs,"props:"+p.id,true)+"</div>";
  });
  return h;
}

function docsCard(title,docs,scope,inline){
  let h=inline?'<h3 class="sub">'+esc(title)+"</h3>":'<div class="card"><div class="ttl"><h2>'+esc(title)+"</h2></div>";
  h+=docs.length?tbl("<th>Document</th><th>Counterparty</th><th class='r'>Starts</th><th class='r'>Ends</th><th class='r'>Value</th><th></th>",
    docs.map(x=>"<tr><td><b style='font-weight:550'>"+esc(x.name)+"</b><div class='dim'>"+esc(x.kind||"")+(x.where?" · "+esc(x.where):"")+"</div>"+(x.note?"<div class='dim'>"+esc(x.note)+"</div>":"")+"</td><td style='color:var(--dim)'>"+esc(x.party||"—")+"</td><td class='r'>"+dshort(x.start)+"</td><td class='r'>"+dshort(x.end)+"</td><td class='r'>"+(N(x.value)?money(x.value):"—")+"</td><td class='r'>"+editBtn("docs",x.id)+"</td></tr>").join(""))
    :'<div class="empty"><p>No documents filed.</p></div>';
  h+='<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn ghost sm" data-add="docs"'+(scope?" data-preset='"+esc(JSON.stringify({scope}))+"'":"")+">Add document</button></div>";
  return h+(inline?"":"</div>");
}

/* ---- settings ---- */
function vSettings(){
  const names={tx:"รายการเงิน",dues:"รายการรายเดือน",debts:"หนี้",ins:"กรมธรรม์",cars:"รถ",maint:"ประวัติซ่อมบำรุง",props:"บ้าน/คอนโด",bills:"บิล",refi:"รีไฟแนนซ์",docs:"เอกสาร"};
  return head("ข้อมูลและสำรองข้อมูล","ข้อมูลทั้งหมดอยู่ในเบราว์เซอร์เครื่องนี้")+
    '<div class="stats">'+Object.keys(names).map(k=>stat(names[k],String((S.db[k]||[]).length),"")).join("")+"</div>"+
    '<div class="card"><div class="ttl"><h2>สำรองข้อมูล</h2></div>'+
    '<p style="color:var(--dim);font-size:13.5px;max-width:560px">ไม่มีการอัปโหลดข้อมูลออกไปไหน ถ้าล้างข้อมูลเบราว์เซอร์ ข้อมูลจะหาย ควรส่งออกไฟล์สำรองเดือนละครั้ง และนำเข้าไฟล์นี้ในเครื่องอื่นได้</p>'+
    '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="btn" id="exp">ส่งออกไฟล์สำรอง</button>'+
    '<button class="btn ghost" id="impBtn">นำเข้าไฟล์สำรอง</button><input type="file" id="imp" accept="application/json" style="display:none">'+
    '<div class="grow"></div><button class="btn warn" id="wipe">ลบข้อมูลทั้งหมด</button></div></div>'+
    '<div class="card"><div class="ttl"><h2>หน้าตา</h2></div><div class="seg">'+
    '<button data-set-theme="dark" aria-pressed="'+(S.db.cfg.theme!=="light")+'">มืด</button>'+
    '<button data-set-theme="light" aria-pressed="'+(S.db.cfg.theme==="light")+'">สว่าง</button></div></div>';
}

/* ═══════════ events ═══════════ */
document.addEventListener("click",e=>{
  const th=e.target.closest("[data-set-theme]");
  if(th){S.db.cfg.theme=th.dataset.setTheme;document.documentElement.dataset.theme=th.dataset.setTheme;save();render();return}
  const id=e.target.id;
  if(id==="exp"){
    const b=new Blob([JSON.stringify(S.db,null,2)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download="runway-backup-"+iso(new Date())+".json";a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("ดาวน์โหลดไฟล์สำรองแล้ว");
  }
  if(id==="impBtn")document.getElementById("imp").click();
  if(id==="wipe"&&confirm("ลบข้อมูลทั้งหมด? ถ้าไม่มีไฟล์สำรองจะกู้คืนไม่ได้")){
    const th=S.db.cfg.theme;S.db=clone(BLANK);S.db.cfg.theme=th;save();render();toast("ลบข้อมูลทั้งหมดแล้ว");
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="imp"&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{
      S.db=Object.assign(clone(BLANK),JSON.parse(fr.result));if(!S.db.cfg)S.db.cfg={theme:"dark"};
      migrate();document.documentElement.dataset.theme=S.db.cfg.theme;save();render();toast("นำเข้าข้อมูลสำรองแล้ว");
    }catch(err){toast("อ่านไฟล์ไม่ได้ กรุณาใช้ไฟล์สำรองของ Runway")}};
    fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const v=document.querySelector(".veil");if(v)v.remove()}});

(async()=>{await load();render()})();
</script>
