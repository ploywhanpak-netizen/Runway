<!DOCTYPE html>
<html lang="th">
<head>

<title>เจ้านาย - ระบบขออนุมัติ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: #f4f5f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 8px; }
  p { color: #666; margin-bottom: 24px; }
  a.back {

    text-decoration: none;
    font-size: 14px;
    border: 1px solid #ddd;
    padding: 10px 20px;

<body>
  <div class="icon">👔</div>
  <h1>เจ้านาย</h1>
  <p>หน้านี้กำลังจัดทำ เร็วๆ นี้</p>
  <a class="back" href="index.html">&larr; กลับหน้าหลัก</a>
